<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSCI Fortune Jar - Open House</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="main-layout">
        <header class="header">
            <h1>✨ โหลแก้วคำอวยพร COSCI ✨</h1>
            <p class="subtitle">จิ้มที่โหลแก้วหรือกดปุ่มเพื่อรับพลังใจจากรุ่นพี่ COSCI #67-69!</p>
        </header>

        <!-- โหลแก้ว -->
        <div class="jar-wrapper">
            <div class="jar-container" id="jarContainer">
                <div class="jar-cap">
                    <div class="cap-shine"></div>
                </div>
                <div class="jar-neck"></div>
                <div class="jar-rope">
                    <div class="hanging-tag">⭐</div>
                </div>
                <div class="jar-body">
                    <div class="glass-shine-left"></div>
                    <div class="glass-shine-right"></div>

                    <!-- ดาว 22 ดวงอัดแน่นเต็มโหล -->
                    <div class="stars-container">
                        <span class="star s-pink star-1">⭐</span>
                        <span class="star s-yellow star-2">⭐</span>
                        <span class="star s-blue star-3">⭐</span>
                        <span class="star s-purple star-4">⭐</span>
                        <span class="star s-green star-5">⭐</span>
                        <span class="star s-orange star-6">⭐</span>
                        <span class="star s-pink star-7">⭐</span>
                        <span class="star s-yellow star-8">⭐</span>
                        <span class="star s-blue star-9">⭐</span>
                        <span class="star s-purple star-10">⭐</span>
                        <span class="star s-green star-11">⭐</span>
                        <span class="star s-orange star-12">⭐</span>
                        <span class="star s-pink star-13">⭐</span>
                        <span class="star s-yellow star-14">⭐</span>
                        <span class="star s-blue star-15">⭐</span>
                        <span class="star s-purple star-16">⭐</span>
                        <span class="star s-green star-17">⭐</span>
                        <span class="star s-orange star-18">⭐</span>
                        <span class="star s-pink star-19">⭐</span>
                        <span class="star s-yellow star-20">⭐</span>
                        <span class="star s-blue star-21">⭐</span>
                        <span class="star s-purple star-22">⭐</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ปุ่มสุ่ม -->
        <button class="draw-btn" id="drawBtn">🎲 สุ่มคำอวยพร</button>
    </div>

    <!-- Popup Modal (เปลี่ยนปุ่มด้านล่างเป็นป้ายแสดงชื่อนิ่งๆ ตามเรฟ) -->
    <div class="modal-overlay" id="wishModal">
        <div class="wish-card">
            <span class="close-btn" id="closeBtn">&times;</span>
            <div class="wish-icon">🌟</div>
            <p class="wish-text">กำลังโหลดคำอวยพร...</p>
            <div class="author-badge"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
